apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: listing-service
  namespace: bmf-dev
spec:
  parentRefs:
    - name: bmf
      namespace: bmf-gateway
  hostnames:
    - api.bmf.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /farms
      backendRefs:
        - name: listing-service
          port: 80